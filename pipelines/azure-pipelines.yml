trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  TF_VERSION: "1.13.0"
  ANSIBLE_COLLECTION: "azure.azcollection"
  ENVIRONMENT: "dev"

stages:
  - stage: Terraform
    displayName: "Provision Infrastructure"
    jobs:
      - job: terraform
        displayName: "Run Terraform"
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.x'

          - script: |
              curl -sLo terraform.zip https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip
              unzip terraform.zip
              sudo mv terraform /usr/local/bin/terraform
              terraform -version
            displayName: "Install Terraform"

          - task: AzureCLI@2
            displayName: "Terraform Init"
            inputs:
              azureSubscription: 'terraform-connection'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                cd terraform
                terraform init -backend-config="environments/${ENVIRONMENT}/backend.tfvars"

          - task: AzureCLI@2
            displayName: "Terraform Plan"
            inputs:
              azureSubscription: 'terraform-connection'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                cd terraform
                terraform plan -var-file="environments/${ENVIRONMENT}/variables.tfvars"

          - task: AzureCLI@2
            displayName: "Terraform Apply"
            inputs:
              azureSubscription: 'terraform-connection'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                cd terraform
                terraform apply -auto-approve -var-file="environments/${ENVIRONMENT}/variables.tfvars"

          - task: AzureCLI@2
            displayName: "Export Terraform Outputs"
            inputs:
              azureSubscription: 'terraform-connection'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "##vso[task.setvariable variable=resource_group]$(cd terraform && terraform output -raw resource_group_name)"
                echo "##vso[task.setvariable variable=vm_name]$(cd terraform && terraform output -raw vm_name)"

  - stage: ConfigureVM
    displayName: "Configure Virtual Machine via Azure API"
    dependsOn: Terraform
    jobs:
      - job: ansible
        displayName: "Run Ansible Playbook"
        steps:
          - script: |
              sudo apt-get update
              sudo apt-get install -y ansible python3-pip
              pip3 install packaging
              ansible-galaxy collection install $(ANSIBLE_COLLECTION)
            displayName: "Install Ansible & Collection"

          - task: AzureCLI@2
            displayName: "Run Ansible Playbook"
            inputs:
              azureSubscription: 'terraform-connection'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                export AZURE_RESOURCE_GROUP="$(resource_group)"
                export AZURE_VM_NAME="$(vm_name)"
                export AZURE_LOCATION="westeurope"

                ansible-playbook ansible/playbook.yml
